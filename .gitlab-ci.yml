variables:
  TWINE_USERNAME: __token__

stages:
- test
- pypi

test:
  image: python:3.9-bullseye
  stage: test
  before_script:
    - pip install -r requirements.txt
    - pip install -r test_requirements.txt
  script:
    # TODO use tox
    - pylint --rcfile=.pylintrc src/
    - flake8 src/ --max-line-length 100
    - pydocstyle src/

package:
  image: python:3.9-bullseye
  stage: pypi
  script:
    - pip install twine
    - python setup.py sdist bdist_wheel
    - TWINE_PASSWORD=${CI_JOB_TOKEN} TWINE_USERNAME=gitlab-ci-token python -m twine upload --repository-url ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/pypi dist/*
  only:
  - main

pypi:
  image: python:3.9-bullseye
  stage: pypi
  before_script:
  #- pip install --upgrade pip
  #- pip install --upgrade build
  - pip install twine
  #- pip install -r requirements.txt
  - rm -rf dist
  - mkdir -p dist
  script:
  - cd dist
  - |
    pip download Hydro-Quebec-API-Wrapper --extra-index-url https://gitlab.com/api/v4/projects/32908244/packages/pypi/simple --no-deps --no-binary :all:
  - |
    pip download Hydro-Quebec-API-Wrapper --extra-index-url https://gitlab.com/api/v4/projects/32908244/packages/pypi/simple --no-deps
  - cd ..
  - twine upload --non-interactive --repository testpypi dist/*
  only:
  - tags
