variables:
  TWINE_USERNAME: __token__

stages:
- test
- private_tests
- private_tests_done
- pypi

test:
  stage: test
  tags:
  - hydroqc
  image: python:3.9-bullseye
  script:
    - apt-get update && apt-get install -y graphviz
    - pip install tox
    - tox -e pylint,flake8,pydocstyle,typing,black
    - cat mypy-txt-report/index.txt
  artifacts:
    reports:
      junit: mypy-junit.xml
    paths:
      - mypy-txt-report/
      - mypy-html-report/
      - classes.png
      - classes.mmd
      - classes.html
      - packages.png
      - packages.mmd
      - packages.html
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CI_COMMIT_TAG'
      when: never
    - when: on_success

.private_test_script: &private_test_script
  stage: private_tests
  tags:
  - hydroqc
  image: python:3.9-bullseye
  script:
    - apt update && apt install -y jq unzip
    - >
      OUTPUT=$(curl
      --globoff
      --header "Content-Type: application/json"
      --header "PRIVATE-TOKEN: ${HYDROQC_SA_TOKEN}"
      "https://gitlab.com/api/v4/projects/${PROJECT_ID}")
    - PROJECT_PATH=$(echo ${OUTPUT} | jq -r .path_with_namespace)
    - >
      OUTPUT=$(curl
      --globoff
      --request POST
      --header "Content-Type: application/json"
      --header "PRIVATE-TOKEN: ${HYDROQC_SA_TOKEN}"
      https://gitlab.com/api/v4/projects/${PROJECT_ID}/pipeline
      --data '{ "ref": "main", "variables": [{ "key": "UPSTREAM_BRANCH", "value": "'${CI_COMMIT_REF_NAME}'" }, { "key": "UPSTREAM_COMMIT_SHA", "value": "'${CI_COMMIT_SHA}'" }, { "key": "UPSTREAM_REPO", "value": "'${CI_REPOSITORY_URL}'" }] }')
    - echo ${OUTPUT}
    - PIPELINE_ID=$(echo ${OUTPUT} | jq -r .id)
    - echo ${PIPELINE_ID}
    - sleep 5
    - >
      OUTPUT=$(curl
      --globoff
      --header "Content-Type: application/json"
      --header "PRIVATE-TOKEN: ${HYDROQC_SA_TOKEN}"
      "https://gitlab.com/api/v4/projects/${PROJECT_ID}/pipelines/${PIPELINE_ID}/jobs")
    - echo ${OUTPUT}
    - JOB_ID=$(echo ${OUTPUT} | jq -r .[0].id)
    - JOB_STATUS=$(echo ${OUTPUT} | jq -r .[0].status)
    - |
      while [ "${JOB_STATUS}" == "pending" ] || [ "${JOB_STATUS}" == "running" ]
      do
        echo "Waiting for pipeline ends"
        sleep 10
        OUTPUT=$(curl --globoff --header "Content-Type: application/json" --header "PRIVATE-TOKEN: ${HYDROQC_SA_TOKEN}" "https://gitlab.com/api/v4/projects/${PROJECT_ID}/pipelines/${PIPELINE_ID}/jobs")
        JOB_STATUS=$(echo ${OUTPUT} | jq -r .[0].status)
        echo ${JOB_STATUS}
      done
    - sleep 5
    - JOB_END_DATE=$(echo ${OUTPUT}| jq -r .[0].finished_at)
    - |
      echo -e "\n\n\n"
      echo '######################'
      echo '###PRIVATE JOB LOGS###'
      echo '######################'
    - |
      curl --location --header "PRIVATE-TOKEN: ${HYDROQC_SA_TOKEN}" "https://gitlab.com/api/v4/projects/${PROJECT_ID}/jobs/${JOB_ID}/trace"
    - |
      echo -e "\n"
      echo '##########################'
      echo '###END PRIVATE JOB LOGS###'
      echo '##########################'
      echo -e "\n"
    - |
      curl --location --output artifacts.zip --header "PRIVATE-TOKEN: ${HYDROQC_SA_TOKEN}" "https://gitlab.com/api/v4/projects/${PROJECT_ID}/jobs/${JOB_ID}/artifacts"
    - unzip artifacts.zip
    - COLOR=yellow
    - |
      if [ "${JOB_STATUS}" == "success" ]
      then
        export PIPELINE_COLOR=green
      fi
    - |
      if [ "${JOB_STATUS}" == "failed" ]
      then
        export PIPELINE_COLOR=red
      fi
    - >
      curl
      --location
      --output ${PROJECT_ID}-badge.svg
      https://badgen.net/badge/scenario/${PROJECT_ID}/${PIPELINE_COLOR}
    - echo https://badgen.net/badge/scenario/${PROJECT_ID}/${PIPELINE_COLOR}
    - >
      curl
      --location
      --output ${PROJECT_ID}-job-end-date.svg
      https://badgen.net/badge/last%20run/${JOB_END_DATE}/blue
    - if [ "${JOB_STATUS}" != "success" ] ; then exit 1 ; fi
  artifacts:
    when: always
    paths:
      - hydroqc/tests_result_junit.*.xml
      - hydroqc/.coverage.*.dat
      - "*-badge.svg"
      - "*-job-end-date.svg"
    reports:
      junit: hydroqc/tests_result_junit.*.xml
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CI_COMMIT_TAG'
      when: never
    - when: on_success


private_test_titilambert:
  variables:
    PROJECT_ID: 35085986
  <<: *private_test_script

private_test_mdallaire:
  variables:
    PROJECT_ID: 35331048
  <<: *private_test_script

private_tests_done:
  stage: private_tests_done
  tags:
  - hydroqc
  image: python:3.9-bullseye
  script:
    - echo "Private Tests done"
    - pip install tox
    - find .
    - mv -v hydroqc/.coverage* .
    - mv -v hydroqc/*.xml .
    - tox -e cov-combine,cov-report
    - ls -al
  needs:
  - job: private_test_mdallaire
  - job: private_test_titilambert
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - htmlcov
      - coverage.xml
      - "*-badge.svg"
      - "*-job-end-date.svg"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CI_COMMIT_TAG'
      when: never
    - when: on_success

package:
  stage: test
  tags:
  - hydroqc
  image: python:3.9-bullseye
  script:
    - rm -rf dist
    - mkdir -p dist
    # Build a package with a version based on the commmit short sha
    - sed 's/^VERSION = "\([^"]*\)"/VERSION = "\1rc'${CI_PIPELINE_ID}'"/' -i src/hydroqc/__version__.py
    - pip install --upgrade pip
    - pip install --upgrade build setuptools wheel twine
    - python setup.py develop
    - ls -l
    - pwd
    - python3 -m build
    - pip install -r requirements.txt
    - python setup.py sdist bdist_wheel
    - TWINE_PASSWORD=${CI_JOB_TOKEN} TWINE_USERNAME=gitlab-ci-token python -m twine upload --repository-url ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/pypi dist/*
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - if: '$CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH'
      when: on_success
    - when: never

