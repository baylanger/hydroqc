[tox]
envlist = pylint,flake8,pydocstyle,cov-init,py39,cov-report
skip_missing_interpreters = True

[testenv:pylint]
basepython = {env:PYTHON3_PATH:python3}
ignore_errors = True
deps =
    -r {toxinidir}{/}requirements.txt
    -r {toxinidir}{/}test_requirements.txt
commands =
    pylint --rcfile=.pylintrc src tests

[testenv:flake8]
basepython = {env:PYTHON3_PATH:python3}
deps =
    -r {toxinidir}{/}requirements.txt
    -r {toxinidir}{/}test_requirements.txt
commands =
    flake8 --max-line-length=100 src tests

[testenv:pydocstyle]
basepython = {env:PYTHON3_PATH:python3}
deps =
    -r {toxinidir}{/}requirements.txt
    -r {toxinidir}{/}test_requirements.txt
commands =
    pydocstyle src tests

[testenv:cov-init]
setenv =
    COVERAGE_FILE = .coverage
deps = coverage
commands =
    coverage erase

[testenv]
usedevelop=True
setenv =
    COVERAGE_FILE = .coverage
passenv =
    HYDROQC_USERNAME
    HYDROQC_PASSWORD
    HYDROQC_RATE
    HYDROQC_ACCOUNT_ID
    HYDROQC_EPP_ENABLED
    HYDROQC_WC_ENABLED

install_command = {envpython} -m pip install {opts} {packages}
commands =
    pytest -vvv --junitxml=tests_result_junit.xml --cov --cov-report= {posargs} tests --asyncio-mode=strict
deps =
    -r {toxinidir}{/}requirements.txt
    -r {toxinidir}{/}test_requirements.txt

[testenv:cov-combine]
setenv =
    COVERAGE_FILE = .coverage
deps = coverage
commands =
    coverage combine

[testenv:cov-report]
setenv =
    COVERAGE_FILE = .coverage
deps = coverage
commands =
    coverage report --include=src/hydroqc/*
    coverage html --include=src/hydroqc/*
    coverage xml --include=src/hydroqc/*
