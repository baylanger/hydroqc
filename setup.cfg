[metadata]
name = Hydro Quebec API Wrapper
author = Hydroqc Team
# author_email = MISSING
description = Bases to build mqtt daemon compatible with Home Assistant
long_description = file: README.md
long_description_content_type = text/markdown
url = http://gitlab.com/hydroqc/hydroqc
classifiers =
    Programming Language :: Python :: 3
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent

[options.data_files]
. = requirements.txt,test_requirements.txt

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9
include_package_data = True

[options.package_data]
hydroqc =
    = hydro_api/hydro-chain.pem
    = py.typed

[options.packages.find]
where = src
